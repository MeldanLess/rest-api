# Боевой стек: PostgreSQL + API, наружу публикуется только через nginx.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Чем отличается от стека разработки и почему:
#   * база не публикуется на хост — с ней общается только API
#   * секреты приходят из файла вне репозитория и никогда отсюда
#   * оба сервиса перезапускаются, если их не остановили, а API стартует
#     только после того, как база отрапортует о состоянии healthy
#   * API работает без --reload и без подключённых исходников

services:
  db:
    image: postgres:16-alpine
    container_name: applytrack-db
    restart: unless-stopped
    env_file:
      - ./env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Извне хоста база недоступна.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Без `ports:` — попасть внутрь можно только из контейнера API в этой сети.

  api:
    image: ${API_IMAGE:-applytrack-api:latest}
    container_name: applytrack-api
    restart: unless-stopped
    env_file:
      - ./env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # nginx в этом файле нет: на сервере он установлен как системный сервис, а не
  # запускается контейнером — тогда certbot обновляет сертификаты TLS без
  # перезапуска контейнера. Подробнее в docs/DEPLOYMENT.md.

volumes:
  postgres_data:
