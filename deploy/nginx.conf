# nginx перед API.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/applytrack
#   sudo ln -s /etc/nginx/sites-available/applytrack /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS терминируется здесь: certbot кладёт сертификат в /etc/letsencrypt/, а
# этот файл переписывается так, чтобы всё шло на HTTPS.

upstream applytrack_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    # Проверка ACME от certbot должна остаться на обычном HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.your-domain.com;

    # Этими файлами управляет certbot; `certbot --nginx` переписывает пути
    # на месте.
    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # Собственный журнал доступа у API отключён в пользу структурированного
    # лога, поэтому это единственный журнал доступа — и в нём есть
    # идентификатор запроса, по которому и находится медленный запрос.
    log_format applytrack '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent rt=$request_time '
                         'rid=$upstream_http_x_request_id';
    access_log /var/log/nginx/applytrack.access.log applytrack;
    error_log  /var/log/nginx/applytrack.error.log;

    location / {
        proxy_pass http://applytrack_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Пересылаем идентификатор запроса вызывающей стороны, если он есть,
        # чтобы запрос, пересекающий границу сервисов, оставался прослеживаемым
        # от начала до конца.
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Схема OpenAPI и страница документации меняются редко — их можно кэшировать.
    location /openapi.json {
        proxy_pass http://applytrack_api;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }
}
