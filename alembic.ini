# Настройка Alembic.
#
# Адрес базы здесь НЕ задаётся — `alembic/env.py` берёт его из настроек
# приложения (переменные окружения / .env), поэтому место, где известно, как
# подключиться к базе, ровно одно.

[alembic]
script_location = alembic
prepend_sys_path = .
# Разделитель путей для `prepend_sys_path`. Alembic 1.16 предупреждает, если
# его не задать, и разбирает путь по старинке — по пробелам, запятым и
# двоеточиям. На Windows двоеточие есть в пути к диску, поэтому «правильный»
# разбор здесь обязателен, а не косметика.
path_separator = os
version_path_separator = os
# sqlalchemy.url задаётся во время выполнения в alembic/env.py
sqlalchemy.url =

# Логирование
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
