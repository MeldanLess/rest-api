name: Публикация образа

# Собирает образ контейнера и отправляет его в GitHub Container Registry, когда
# отправлен тег с версией. Именно тег тянет сервер, поэтому релиз — это
# `git tag` и пуш: та же дисциплина релизов, что и у тега `v1.0.0`, который
# требуют соглашения портфолио.
#
# Тесты выполняются первыми, в той же задаче: образ, не прошедший собственный
# набор тестов, в реестр не попадает.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Тесты, сборка и отправка
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: applytrack
          POSTGRES_PASSWORD: applytrack
          POSTGRES_DB: applytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applytrack -d applytrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
      SECRET_KEY: ci-only-insecure-secret-key-not-used-in-production
      ENVIRONMENT: test

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Готовим Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Ставим зависимости
        run: pip install -r requirements-dev.txt

      - name: Проверяем стиль
        run: ruff check .

      - name: Запускаем тесты
        run: pytest --cov=app --cov-report=term-missing

      - name: Входим в реестр контейнеров
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собираем и отправляем образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
