name: CI

# Проверяет стиль и запускает тесты при каждом пуше и каждом pull request.
#
# Тесты выполняются против настоящего сервиса PostgreSQL — того же движка,
# тех же типов и ограничений, что и в бою. Против SQLite было бы быстрее, но
# там скрываются ошибки, которые как раз нужно ловить.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Проверка стиля и тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: applytrack
          POSTGRES_PASSWORD: applytrack
          POSTGRES_DB: applytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applytrack -d applytrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://applytrack:applytrack@localhost:5432/applytrack
      SECRET_KEY: ci-only-insecure-secret-key-not-used-in-production
      ENVIRONMENT: test

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Готовим Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Ставим зависимости
        run: pip install -r requirements-dev.txt

      - name: Проверяем стиль
        run: ruff check .

      - name: Запускаем тесты
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Выкладываем отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
